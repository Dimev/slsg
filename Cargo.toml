[package]
name = "slsg"
description = "Scriptable Lua Site Generator"
version = "0.5.0"
license = "GPL-3.0-only"
repository = "https://github.com/Dimev/slsg"
keywords = ["lua", "website", "html", "blog", "markdown"]
categories = ["web-programming", "template-engine", "command-line-utilities"]
edition = "2024"

[dependencies]
mlua = { version = "0.11.0", features = ["luajit", "macros", "anyhow"] }
pulldown-cmark = "0.13.0"
lol_html = "2.6.0"
grass = "0.13.4"
latex2mathml = "0.2.3"
hb-subset = "0.3.0"
crossterm = "0.29.0"
notify = "8.2.0"
pico-args = "0.5.0"
syntect = "5.3.0"
relative-path = "2.0.1"
tera = "1.20.0"
toml = "0.9.8"
anyhow = "1.0.100"
globwalk = "0.9.1"

