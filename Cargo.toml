[package]
name = "slsg"
description = "Scriptable Lua Site Generator"
version = "0.5.0"
license = "GPL-3.0-only"
repository = "https://github.com/Dimev/slsg"
keywords = ["lua", "website", "html", "blog", "markdown"]
categories = ["web-programming", "template-engine", "command-line-utilities"]
edition = "2024"

[profile.release]
opt-level = "z"
strip = true

[dependencies]
mlua = { version = "0.11.0", features = ["luajit", "macros", "anyhow", "serde"] }
pulldown-cmark = "0.13.0"
latex2mathml = "0.2.3"
hb-subset = "0.3.0"
crossterm = "0.29.0"
notify = "8.2.0"
pico-args = "0.5.0"
relative-path = "2.0.1"
toml = "0.9.8"
anyhow = "1.0.100"
globwalk = "0.9.1"
ctrlc = "3.5.1"
flate2 = "1.1.5"


